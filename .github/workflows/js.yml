name: js

on:
  push:
    branches: [master, reference-node]
    paths: ["js/**", "protocol/proto/**", "conformance/vectors.json", ".github/workflows/js.yml"]
  pull_request:
    paths: ["js/**", "protocol/proto/**", "conformance/vectors.json", ".github/workflows/js.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: js/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test # includes the cross-client conformance test vs conformance/vectors.json
      - run: pnpm run format:check
