appId: org.bpprotocol.desktop
productName: BlockParty
# Without this the binary is named after the npm package (@blockparty/desktop),
# which lands as "@blockpartydesktop" on disk.
executableName: blockparty
copyright: BlockParty contributors
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - .output/public/**/*
  - package.json
# The bundled bpnode lands in the app's resources dir (process.resourcesPath),
# where the supervisor looks for it by default (#42). beforePack builds it for
# the exact platform/arch being packaged (#48), so the filter only ever matches
# the one binary that belongs in this artifact.
beforePack: scripts/before-pack.mjs
extraResources:
  - from: resources
    to: .
    filter: ['bpnode', 'bpnode.exe']
asar: true
# Signing and notarization are deliberately out of scope here: unsigned
# artifacts still install and launch on all three platforms.
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.social-networking
  identity: null
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  # Required by the deb target; change this if the project gains a real
  # packaging contact.
  maintainer: BlockParty contributors <blockparty@users.noreply.github.com>
  target:
    # deb first: its postinst installs chrome-sandbox setuid root, which is what
    # Chromium's SUID sandbox needs on distros that restrict unprivileged user
    # namespaces (Ubuntu >= 23.10). An AppImage mounts nosuid, so its sandbox
    # helper can never be configured that way — see the README.
    - target: deb
      arch: [x64]
    - target: AppImage
      arch: [x64]
  category: Network
  synopsis: Desktop client for the BlockParty protocol
  artifactName: ${productName}-${version}-${arch}.${ext}
deb:
  afterInstall: scripts/deb-after-install.sh
  afterRemove: scripts/deb-after-remove.sh
  # Ship the AppArmor profile that lets Chromium's namespace sandbox work on
  # Ubuntu 23.10+ (see the README's Linux sandbox note). fpm takes extra inputs
  # as source=destination, which is how a file outside the app dir gets in.
  fpm:
    - build/linux/apparmor-profile=/etc/apparmor.d/blockparty
