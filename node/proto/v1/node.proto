syntax = "proto3";

package blockparty.node.v1;

option go_package = "github.com/bpprotocol/blockparty/node/internal/nodepb;nodepb";

// NodeService is the bpnode client API (#38), consumed by the desktop client
// (#26) over Connect. This is the Phase-1 local slice: world status & bootstrap,
// post, and read. Live subscription (server-streaming) lands with gossip (#35)
// and the connection RPCs with #37.
service NodeService {
  // GetStatus reports node mode, whether a World is loaded, the identity, and
  // the stored block count. Used by the client's onboarding flow (#26 Q5).
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);

  // BootstrapWorld configures the node's World at runtime when none is loaded
  // (personal mode only): it initializes the keystore from the supplied secrets.
  // Honors the single-World invariant.
  rpc BootstrapWorld(BootstrapWorldRequest) returns (BootstrapWorldResponse);

  // PostText authors a content.post to a public audience. The client submits
  // intent (audience + text); the node encrypts and signs (world_sig+author_sig)
  // and stores it. The client never handles a private key.
  rpc PostText(PostTextRequest) returns (PostTextResponse);

  // GetBlock fetches a stored block by ID, returning plaintext when the node can
  // open the audience (public audience in personal mode), ciphertext otherwise.
  rpc GetBlock(GetBlockRequest) returns (GetBlockResponse);

  // ListBlocks queries the local index by audience, type, author, or time range.
  rpc ListBlocks(ListBlocksRequest) returns (ListBlocksResponse);

  // SubscribeBlocks streams a BlockEvent for each block accepted onto an
  // audience after subscription — the live feed (#44). Pair with ListBlocks for
  // the initial backlog.
  rpc SubscribeBlocks(SubscribeBlocksRequest) returns (stream BlockEvent);

  // --- Connections (#46, personal mode) ---

  // GetIdentity returns this node's connection card (address + public keys) to
  // share out-of-band so a peer can connect.
  rpc GetIdentity(GetIdentityRequest) returns (GetIdentityResponse);

  // AddPeer registers a known peer's card so the node can connect to it and
  // recognize its handshake blocks.
  rpc AddPeer(AddPeerRequest) returns (AddPeerResponse);

  // StartConnection initiates a connect.request handshake to a registered peer.
  rpc StartConnection(StartConnectionRequest) returns (StartConnectionResponse);

  // ListConnections lists the node's active connections.
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);

  // RotateConnection advances a connection to a new epoch (re-keys the channel).
  rpc RotateConnection(ConnectionRef) returns (ConnectionResult);

  // CloseConnection tears a connection down and notifies the peer.
  rpc CloseConnection(ConnectionRef) returns (ConnectionResult);

  // SendPrivateText posts an encrypted message on a connection's private audience.
  rpc SendPrivateText(SendPrivateTextRequest) returns (PostTextResponse);

  // ListConnectionMessages returns the decrypted messages on a connection's
  // current private audience.
  rpc ListConnectionMessages(ConnectionRef) returns (ListConnectionMessagesResponse);
}

message GetStatusRequest {}

message GetStatusResponse {
  string version = 1;
  string mode = 2;          // "personal" | "relay"
  bool world_loaded = 3;
  string world = 4;         // World fingerprint when loaded
  string identity = 5;      // identity address (personal, keystore unlocked)
  int64 block_count = 6;
  bool can_author = 7;      // node holds an unlocked keystore
}

message BootstrapWorldRequest {
  string world_seed = 1;            // secret: the World seed phrase
  string identity_passphrase = 2;   // secret: seeds the identity
  string keystore_passphrase = 3;   // secret: unlocks the new encrypted keystore
}

message BootstrapWorldResponse {
  string world = 1;     // World fingerprint
  string identity = 2;  // identity address
}

message PostTextRequest {
  uint32 public_audience = 1; // public-N (1..16)
  string text = 2;
}

message PostTextResponse {
  string id = 1; // block ID, hex
}

// BlockSummary is the index view of a stored block (no payload).
message BlockSummary {
  string id = 1;
  string audience_code = 2; // hex
  string type_code = 3;     // hex
  string author = 4;        // hex address ("" if unresolved)
  int64 timestamp = 5;
  int64 received_at = 6;
}

message GetBlockRequest {
  string id = 1;
}

message GetBlockResponse {
  BlockSummary summary = 1;
  bytes data = 2;      // block.data (plaintext if decrypted, else ciphertext)
  bool decrypted = 3;  // node opened the payload
  string text = 4;     // content.post body, when decrypted
}

message ListBlocksRequest {
  // Provide exactly one filter: an audience/type/author exact match, or a time
  // range (from..to inclusive; to=0 means open-ended).
  string audience_code = 1; // hex
  string type_code = 2;     // hex
  string author = 3;        // hex
  int64 from = 4;
  int64 to = 5;
}

message ListBlocksResponse {
  repeated BlockSummary blocks = 1;
}

message SubscribeBlocksRequest {
  string audience_code = 1; // hex; empty = all audiences the node follows
}

message BlockEvent {
  BlockSummary summary = 1;
}

message GetIdentityRequest {}
message GetIdentityResponse {
  string address = 1;
  string kyber_pub = 2; // hex
  string mldsa_pub = 3; // hex
}

message AddPeerRequest {
  string address = 1;
  string kyber_pub = 2; // hex
  string mldsa_pub = 3; // hex
}
message AddPeerResponse {}

message StartConnectionRequest {
  string address = 1; // peer address
}
message StartConnectionResponse {
  string request_id = 1; // connect.request block id (correlates the response)
}

message ConnectionInfo {
  string peer = 1;
  uint64 epoch = 2;
  string audience_code = 3; // current private audience, hex
}
message ListConnectionsRequest {}
message ListConnectionsResponse {
  repeated ConnectionInfo connections = 1;
}

message ConnectionRef {
  string address = 1; // peer address
}
message ConnectionResult {}

message SendPrivateTextRequest {
  string address = 1; // peer address
  string text = 2;
}

message PrivateMessage {
  string author = 1; // hex address ("" if unresolved)
  string text = 2;
  int64 timestamp = 3;
}
message ListConnectionMessagesResponse {
  repeated PrivateMessage messages = 1;
}
