syntax = "proto3";

package blockparty.v1;

option go_package = "github.com/bpprotocol/blockparty/sdk/blockpb;blockpb";

// --- Content & Expression ---

message ContentPost {
  map<string, string> headers = 1;
  bytes body = 2;
}

message ContentReaction {
  string target = 1;
  string reaction = 2;
}

message ContentTagRequest {
  string target = 1;
  string identity = 2;
  string label = 3;
}

message ContentTagAccept {
  string request = 1;
}

message ContentChunkedManifest {
  map<string, string> headers = 1;
  repeated string chunks = 2;
  string sha512 = 3;
}

message ContentChunkedBlock {
  bytes data = 1;
}

message ContentGallery {
  string title = 1;
  string description = 2;
  repeated string blocks = 3;
}

message ContentQuote {
  string quote = 1;
  optional ContentPost commentary = 2;
}

// --- Connections & Relationships ---

message ConnectRequest {
  string target = 1;              // target identity address
  bytes init_kem_pub = 2;         // initiator's ephemeral ML-KEM768 public key
  bytes kem_ciphertext = 3;       // ML-KEM768 ciphertext encapsulated to target's static kyber key
  bytes nonce = 4;                // 32 random bytes
}

message ConnectResponse {
  string request = 1;             // connect.request block id
  bytes kem_ciphertext = 2;       // ML-KEM768 ciphertext encapsulated to initiator's init_kem_pub
  bytes nonce_response = 3;       // 32 random bytes
}

message ConnectIdentity {
  string name = 1;
  repeated string keys = 2;       // additional public keys shared within the connection
}

message ConnectRotate {
  string new_channel = 1;         // hex audience_code of the next epoch
  bytes kem_ciphertext = 2;       // fresh ML-KEM768 contribution (forward ratchet)
}

message ConnectClose {
  string target = 1;
  string reason = 2;
}

// --- Identity & Lifecycle ---

message IdentityDeclare {
  string name = 1;
  repeated string public_keys = 2;
}

message IdentityBurn {
  string identity = 1;          // address of the identity being burned
  bytes revealed_ml_dsa = 2;    // revealed root ML-DSA-65 private key
  bytes revealed_kyber = 3;     // revealed root ML-KEM768 private key
  string burn_notice = 4;       // "voluntary" | "compromised" | "rotated" | "other"
}

// --- Chunked Data ---

message ChunkManifest {
  repeated string chunks = 1;
  string sha512 = 2;
}

message ChunkBlock {
  bytes data = 1;
}

// --- RPC Interaction ---

message RpcRequest {
  string id = 1;
  string method = 2;
  map<string, string> params = 3;
}

message RpcResponse {
  string id = 1;
  map<string, string> result = 2;
  string error = 3;
}

message RpcRender {
  string id = 1;
  string method = 2;
  map<string, string> params = 3;
}
